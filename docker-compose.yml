services:
  db:
    image: pgvector/pgvector:pg16
    container_name: dra-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: dra
      POSTGRES_PASSWORD: dra
      POSTGRES_DB: dra
    ports:
      - "5432:5432"
    volumes:
      - dra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dra"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The agent API. Build locally on the VPS (small repo, no registry needed):
  #   docker compose up -d --build api
  # Ollama, when used, runs directly on the host (see README VPS section).
  api:
    build: .
    container_name: dra-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: dra
      POSTGRES_PASSWORD: dra
      POSTGRES_DB: dra
      # LiteLLM model routing — same knobs as the local stack, driven by .env
      # (docker compose reads .env for ${VAR:-default} substitution).
      LITELLM_MODEL_CHAT: ${LITELLM_MODEL_CHAT:-ollama/llama3.2}
      LITELLM_MODEL_CHAT_FALLBACK: ${LITELLM_MODEL_CHAT_FALLBACK:-}
      LITELLM_MODEL_EMBED: ${LITELLM_MODEL_EMBED:-ollama/nomic-embed-text}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Per-run cost cap (AD-15): unset = uncapped; surfaced as a startup
      # warning when unparseable. The worker enforces; the api passes it
      # through so the compose knob is one.
      RUN_COST_CAP_USD: ${RUN_COST_CAP_USD:-}
      # LiteLLM's Ollama provider reads OLLAMA_API_BASE (verified in litellm
      # source); without this it would dial localhost:11434 *inside the
      # container*. host-gateway maps host.docker.internal to the host.
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"

  # The async worker: claims jobs from the Postgres queue and executes the
  # graph. Mirrors the api service (same image/build, separate command) with
  # no published port.
  worker:
    build: .
    container_name: dra-worker
    restart: unless-stopped
    command: python -m scripts.worker
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: dra
      POSTGRES_PASSWORD: dra
      POSTGRES_DB: dra
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-2}
      # LiteLLM model routing — same knobs as the api service.
      LITELLM_MODEL_CHAT: ${LITELLM_MODEL_CHAT:-ollama/llama3.2}
      LITELLM_MODEL_CHAT_FALLBACK: ${LITELLM_MODEL_CHAT_FALLBACK:-}
      LITELLM_MODEL_EMBED: ${LITELLM_MODEL_EMBED:-ollama/nomic-embed-text}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Per-run cost cap (AD-15): unset = uncapped; garbage logs a warning.
      RUN_COST_CAP_USD: ${RUN_COST_CAP_USD:-}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  caddy:
    image: caddy:2
    container_name: dra-caddy
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  dra_pgdata:
  caddy_data:
  caddy_config: